paths:
  - Configuration/
  - Resources/Public/Examples/TypoScript/

filePatterns:
  - "*.typoscript"
  - "*.tsconfig"

sniffs:
  - class: Indentation
    parameters:
      indentPerLevel: 2
      useSpaces: true
  - class: RepeatingRValue
    parameters:
      allowedIdentifiers:
        - EXT:
  - class: DeadCode
  - class: OperatorWhitespace
  - class: DuplicateAssignment
  - class: EmptySection
