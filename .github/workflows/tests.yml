name: Tests

on:
  push:
    branches: [ main, 'feature/**', 'support/**' ]
  pull_request:

jobs:
  unit-tests:
    name: "Unit Tests with TYPO3 ${{ matrix.typo3-version }} and PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['^14.3']
        php-version: ['8.3', '8.4']
        include:
          - typo3-version: '^15.0'
            php-version: '8.5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP version ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, intl, zip, json, iconv, gd
          coverage: xdebug,pcov
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # These dev tools have no version for TYPO3 15 yet; PHPStan and Rector run with TYPO3 14
      - name: Remove dev tools without TYPO3 15 support
        if: matrix.typo3-version == '^15.0'
        run: composer remove --dev --no-update saschaegerer/phpstan-typo3 ssch/typo3-rector helmich/typo3-typoscript-lint

      - name: Install dependencies with TYPO3 ${{ matrix.typo3-version }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3-version }} --no-progress --prefer-dist --optimize-autoloader
          if [ '${{ matrix.typo3-version }}' != '^15.0' ]; then git checkout composer.json; fi

      - name: Run unit tests
        run: |
          php --version
          composer install --no-progress --dev
          composer test:unit

      - name: Run unit tests with coverage
        run: composer test:coverage:unit

  functional-tests:
    name: "Functional Tests with TYPO3 ${{ matrix.typo3-version }} and PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['^14.3']
        php-version: ['8.3', '8.4']
        include:
          - typo3-version: '^15.0'
            php-version: '8.5'
    env:
      typo3DatabaseName: typo3
      typo3DatabaseHost: '127.0.0.1'
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP version ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, intl, zip, json, iconv, gd, mysqli, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # These dev tools have no version for TYPO3 15 yet; PHPStan and Rector run with TYPO3 14
      - name: Remove dev tools without TYPO3 15 support
        if: matrix.typo3-version == '^15.0'
        run: composer remove --dev --no-update saschaegerer/phpstan-typo3 ssch/typo3-rector helmich/typo3-typoscript-lint

      - name: Install dependencies with TYPO3 ${{ matrix.typo3-version }}
        run: |
          composer require typo3/cms-core:${{ matrix.typo3-version }} --no-progress --prefer-dist --optimize-autoloader
          if [ '${{ matrix.typo3-version }}' != '^15.0' ]; then git checkout composer.json; fi
          composer install --no-progress --dev

      - name: Run functional tests
        run: |
          php --version
          composer test:functional
