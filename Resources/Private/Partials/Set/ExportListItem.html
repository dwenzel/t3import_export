<div xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
	<h3>{f:if(condition: set.label, then: set.label, else: set.identifier)}</h3>
	<f:if condition="{set.description}"><p><f:format.nl2br>{set.description}</f:format.nl2br></p></f:if>
	<f:form
			action="exportSet"
			arguments="{identifier: '{set.identifier}'}">
		<f:form.submit
			name="submit"
			value="{f:translate(key: 'button.export')}"
		/>
	</f:form>
</div>
