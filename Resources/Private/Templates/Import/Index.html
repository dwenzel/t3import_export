<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">

<f:layout name="Default"/>
<f:section name="Content">
    <h1>{f:translate(key: 'header.import')}</h1>

    <h2>{f:translate(key: 'header.tasks')}</h2>
    <f:if condition="{tasks}">
        <f:then>
            <div class="typo3-message message-information">
                <div class="message-body">{f:translate(key: 'message.chooseImportTask')}</div>
            </div>
            <ul>
                <f:for each="{tasks}" as="task">
                    <f:render partial="Task/ImportListItem" arguments="{task: task}"/>
                </f:for>
            </ul>

        </f:then>
        <f:else>
            <div class="typo3-message message-notice">
                <div class="message-body">{f:translate(key: 'message.noImportTasksFound')}</div>
            </div>
        </f:else>
    </f:if>

    <h2>{f:translate(key: 'header.sets')}</h2>
    <f:if condition="{sets}">
        <f:then>
            <div class="typo3-message message-information">
                <div class="message-body">{f:translate(key: 'message.chooseImportSet')}</div>
            </div>
            <ul>
                <f:for each="{sets}" as="set">
                    <f:render partial="Set/ListItem" arguments="{set: set, action: 'importSet'}"/>
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <div class="typo3-message message-notice">
                <div class="message-body">{f:translate(key: 'message.noImportSetsFound')}</div>
            </div>
        </f:else>
    </f:if>

</f:section>
</html>
