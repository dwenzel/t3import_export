# Example of a complex import configuration with multiple components
# This demonstrates a comprehensive YAML structure for t3import_export

import:
  tasks:
    newsImport:
      label: "Import News Articles"
      description: |
        Imports news articles from an XML source.
        This task demonstrates multiple component types in action.

      source:
        class: "CPSIT\\ImportExportCore\\File\\DataSourceXML"
        config:
          file: "fileadmin/imports/news_feed.xml"
          element: "item"

      initializers:
        10:
          class: "CPSIT\\T3importExport\\Component\\Initializer\\TruncateTables"
          config:
            tables: "tx_news_domain_model_news"
            disable: 0

      preProcessors:
        10:
          class: "CPSIT\\ImportExportCore\\Processor\\ValueRulesPreProcessor"
          config:
            rules:
              - {rule: copy, field: teaser, from: description}
              - {rule: copy, field: bodytext, from: content}
              - {rule: copy, field: datetime, from: pubDate}

        20:
          # parses the date with strtotime()
          class: "CPSIT\\ImportExportCore\\Processor\\StringToTimePreProcessor"
          config:
            fields: "datetime"

        30:
          class: "CPSIT\\ImportExportCore\\Processor\\SetValuesPreProcessor"
          config:
            values:
              pid: 42

        40:
          class: "CPSIT\\T3importExport\\Component\\PreProcessor\\LookUpDB"
          config:
            select:
              table: "sys_category"
              fields: "uid"
              where:
                AND:
                  # title of the category equals the field "category" of the record
                  condition: "title="
                  value: "category"
              singleRow: true
            targetField: "categories"
            fields:
              uid:
                mapTo: "categories"

      converters:
        10:
          class: "CPSIT\\T3importExport\\Component\\Converter\\ArrayToDomainObject"
          config:
            targetClass: "GeorgRinger\\News\\Domain\\Model\\News"

      postProcessors:
        10:
          class: "CPSIT\\T3importExport\\Component\\PostProcessor\\GenerateFileReference"
          config:
            # uid of an existing sys_file record
            sourceField: "image"
            targetField: "fal_media"
            # page of the file reference records
            targetPage: 42

        20:
          # makes the news a translation of the news whose uid is in the
          # field "parent_uid" of the record (domain objects only; use
          # SetL10nParent for array records)
          class: "CPSIT\\T3importExport\\Component\\PostProcessor\\TranslateObject"
          config:
            parentField: "parent_uid"
            language: 1
            # disabled for records without parent
            disable:
              expression: "(record['parent_uid'] ?? '') == ''"

      target:
        class: "CPSIT\\T3importExport\\Persistence\\DataTargetRepository"
        config:
          targetClass: "GeorgRinger\\News\\Domain\\Model\\News"

      finishers:
        10:
          class: "CPSIT\\T3importExport\\Component\\Finisher\\ClearCache"
          config:
            pages: "42,43"

        20:
          class: "CPSIT\\ImportExportCore\\File\\ValidateXMLFinisher"
          config:
            file: "fileadmin/imports/news_feed.xml"
            schema:
              # with security.system.enforceAllowedFileExtensions, add xsd to
              # $GLOBALS['TYPO3_CONF_VARS']['SYS']['miscfile_ext']
              file: "fileadmin/imports/news_schema.xsd"
