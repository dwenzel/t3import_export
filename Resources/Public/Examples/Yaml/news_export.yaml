# Example of an export configuration
# This demonstrates exporting TYPO3 news articles to XML

export:
  tasks:
    newsExport:
      label: "Export News Articles"
      description: |
        Exports news articles to an XML file.
        This task demonstrates a typical export workflow.
      
      source:
        class: "CPSIT\\T3importExport\\Persistence\\DataSourceDB"
        config:
          table: "tx_news_domain_model_news"
          select:
            fields: "*"
            where: "pid IN (42,43) AND hidden = 0 AND deleted = 0"
            orderBy: "datetime DESC"
      
      preProcessors:
        10:
          class: "CPSIT\\T3importExport\\Component\\PreProcessor\\MapFields"
          config:
            mapping:
              pubDate: "datetime"
              link: "path_segment"
        
        20:
          class: "CPSIT\\T3importExport\\Component\\PreProcessor\\RenderContent"
          config:
            field: "bodytext"
            parseFunc: "< lib.parseFunc_RTE"
      
      converters:
        10:
          class: "CPSIT\\T3importExport\\Component\\Converter\\ArrayToXMLStream"
          config:
            rootElement: "feed"
            rootAttributes:
              xmlns: "http://www.w3.org/2005/Atom"
              version: "2.0"
            recordElement: "item"
      
      target:
        class: "CPSIT\\T3importExport\\Persistence\\DataTargetFileStream"
        config:
          filePath: "fileadmin/exports/news_feed.xml"
      
      finishers:
        10:
          class: "CPSIT\\T3importExport\\Component\\Finisher\\ValidateXML"
          config:
            schema: "fileadmin/schemas/news_schema.xsd"
            
        20:
          class: "CPSIT\\T3importExport\\Component\\Finisher\\DownloadFileStream"
          config: 
            mimeType: "application/xml"