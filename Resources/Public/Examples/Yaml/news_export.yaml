# Example of an export configuration
# This demonstrates exporting TYPO3 news articles to XML

export:
  tasks:
    newsExport:
      label: "Export News Articles"
      description: |
        Exports news articles to an XML file.
        This task demonstrates a typical export workflow.

      source:
        class: "CPSIT\\T3importExport\\Persistence\\DataSourceDB"
        config:
          table: "tx_news_domain_model_news"
          fields: "*"
          where: "pid IN (42,43) AND hidden = 0 AND deleted = 0"
          orderBy: "datetime DESC"

      preProcessors:
        10:
          class: "CPSIT\\ImportExportCore\\Processor\\ValueRulesPreProcessor"
          config:
            rules:
              - {rule: copy, field: pubDate, from: datetime}
              - {rule: copy, field: link, from: path_segment}

      converters:
        10:
          # converts each record into an XML element <item>
          class: "CPSIT\\T3importExport\\Component\\Converter\\ArrayToXMLStream"
          config:
            targetClass: "CPSIT\\T3importExport\\Domain\\Model\\DataStream"
            nodeName: "item"

      target:
        # writes the elements into a temporary file with the root element <feed>
        class: "CPSIT\\T3importExport\\Persistence\\DataTargetXMLStream"
        config:
          output: "file"
          rootNodeName: "feed"

      finishers:
        # stores the temporary file as fileadmin/exports/news_feed.xml (storage 1)
        10:
          class: "CPSIT\\T3importExport\\Component\\Finisher\\WriteFile"
          config:
            target:
              name: "news_feed.xml"
              directory: "exports"
              conflictMode: "replace"

        20:
          class: "CPSIT\\ImportExportCore\\File\\ValidateXMLFinisher"
          config:
            file: "fileadmin/exports/news_feed.xml"
            schema:
              file: "fileadmin/schemas/news_schema.xsd"

        # In the backend module, the finisher DownloadFileStream can send the
        # temporary file to the browser instead of WriteFile:
        # 10:
        #   class: "CPSIT\\T3importExport\\Component\\Finisher\\DownloadFileStream"
        #   config:
        #     type: "application/xml"
        #     filename: "news_feed"
        #     fileExt: "xml"
