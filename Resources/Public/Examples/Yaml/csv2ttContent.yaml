# Example YAML configuration for importing CSV data into tt_content table

import:
  tasks:
    csv2ttContent:
      label: "CSV to tt_content"
      description: |
        Configuration example for an import task. This task uses a CSV file as data source
        and imports into the table tt_content.
        In order to validate the import please adapt the target page id to an existing value.

      source:
        class: "CPSIT\\ImportExportCore\\File\\DataSourceCSV"
        config:
          file: "EXT:t3import_export/Resources/Public/Examples/CSV/csv2ttContent.csv"

      preProcessors:
        - class: "CPSIT\\ImportExportCore\\Processor\\SetValuesPreProcessor"
          config:
            values:
              # target page id
              pid: 1

      target:
        class: "CPSIT\\T3importExport\\Persistence\\DataTargetDB"
        config:
          table: "tt_content"
