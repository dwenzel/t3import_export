services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    CPSIT\T3importExport\:
        resource: '../Classes/*'
        exclude: '../Classes/Persistence/Query/*'

    # Register core package services
    # since cpsit/import-export-core is not a TYPO3 extension, its services
    # are not available for dependency injection
    #CPSIT\ImportExportCore\:
    #  resource: '../../import-export-core/Classes/*'
    #  exclude:
    #        - '../../import-export-core/Classes/Exception/*'
    CPSIT\ImportExportCore\Configuration\YamlConfigurationLoader:
      public: true
      arguments:
        $parser: '@CPSIT\ImportExportCore\Service\YamlConfigurationParser'
    CPSIT\ImportExportCore\Configuration\YamlConfigurationProvider:
      public: true
      arguments:
        $configurationHandler: '@CPSIT\ImportExportCore\Configuration\ConfigurationHandler'
        $yamlLoader: '@CPSIT\ImportExportCore\Configuration\YamlConfigurationLoader'

    # Factories and processor of the core
    CPSIT\ImportExportCore\Factory\ComponentRegistry:
      calls:
        - setDefault: ['CPSIT\ImportExportCore\Persistence\DataSourceInterface', 'CPSIT\T3importExport\Persistence\DataSourceDB']
        - setDefault: ['CPSIT\ImportExportCore\Persistence\DataTargetInterface', 'CPSIT\T3importExport\Persistence\DataTargetRepository']
    CPSIT\ImportExportCore\Factory\ComponentRegistryInterface: '@CPSIT\ImportExportCore\Factory\ComponentRegistry'
    CPSIT\ImportExportCore\Factory\InstantiatorInterface: '@CPSIT\T3importExport\Factory\Typo3Instantiator'
    CPSIT\ImportExportCore\Factory\ComponentFactory: ~
    CPSIT\ImportExportCore\Factory\ComponentFactoryInterface: '@CPSIT\ImportExportCore\Factory\ComponentFactory'
    CPSIT\ImportExportCore\Factory\TransferTaskFactory:
      public: true
    CPSIT\ImportExportCore\Factory\TransferSetFactory: ~
    CPSIT\ImportExportCore\Expression\ExpressionEvaluator: ~
    CPSIT\ImportExportCore\Expression\ExpressionEvaluatorInterface: '@CPSIT\ImportExportCore\Expression\ExpressionEvaluator'
    CPSIT\ImportExportCore\Condition\ConditionEvaluator: ~
    CPSIT\ImportExportCore\Condition\ConditionEvaluatorInterface: '@CPSIT\ImportExportCore\Condition\ConditionEvaluator'
    CPSIT\ImportExportCore\Service\DataTransferProcessor:
      arguments:
        $eventDispatcher: '@Psr\EventDispatcher\EventDispatcherInterface'
        $conditionEvaluator: '@CPSIT\ImportExportCore\Condition\ConditionEvaluatorInterface'

    # Files: paths are resolved like TYPO3 file names, inside the allowed
    # directories; EXT: paths only for reading. URLs are loaded with the HTTP
    # client of TYPO3, only from the allowed hosts. See Documentation/Persistence/Files.md
    CPSIT\T3importExport\Resource\Typo3PathResolver:
      arguments:
        $allowExtensionPaths: true
    t3import_export.target_path_resolver:
      class: CPSIT\T3importExport\Resource\Typo3PathResolver
      arguments:
        $allowExtensionPaths: false
    CPSIT\ImportExportCore\Resource\PathResolverInterface: '@CPSIT\T3importExport\Resource\Typo3PathResolver'
    CPSIT\ImportExportCore\Resource\FileResourceLoader: ~
    CPSIT\T3importExport\Resource\ResourceLoaderFactory:
      arguments:
        $client: '@Psr\Http\Client\ClientInterface'
        $requestFactory: '@TYPO3\CMS\Core\Http\RequestFactory'
    CPSIT\ImportExportCore\Resource\HttpResourceLoader:
      factory: ['@CPSIT\T3importExport\Resource\ResourceLoaderFactory', 'createHttpResourceLoader']
    CPSIT\ImportExportCore\Resource\DelegatingResourceLoader:
      arguments:
        - '@CPSIT\ImportExportCore\Resource\FileResourceLoader'
        - '@CPSIT\ImportExportCore\Resource\HttpResourceLoader'
    CPSIT\ImportExportCore\Resource\ResourceLoaderInterface: '@CPSIT\ImportExportCore\Resource\DelegatingResourceLoader'
    CPSIT\ImportExportCore\File\DataSourceCSV:
      public: true
    CPSIT\ImportExportCore\File\DataSourceXML:
      public: true
    CPSIT\ImportExportCore\File\DataTargetCSV:
      public: true
      arguments:
        $pathResolver: '@t3import_export.target_path_resolver'

    # Database: the DBAL components of the core use the connections of
    # TYPO3; the connection `default` is the TYPO3 connection `Default`
    CPSIT\T3importExport\Dbal\Typo3ConnectionProvider:
      public: true
    CPSIT\ImportExportCore\Dbal\ConnectionProviderInterface: '@CPSIT\T3importExport\Dbal\Typo3ConnectionProvider'
    CPSIT\ImportExportCore\Dbal\DataSourceDBAL:
      public: true
    CPSIT\ImportExportCore\Dbal\DataTargetDBAL:
      public: true
    CPSIT\ImportExportCore\Dbal\RelationListPreProcessor:
      public: true

    CPSIT\T3importExport\Domain\Factory\TransferSetFactory:
      public: true
      arguments:
        $configurationHandler: '@CPSIT\ImportExportCore\Configuration\ConfigurationHandler'
    CPSIT\T3importExport\Service\TransferService:
      public: true
    CPSIT\T3importExport\Property\TypeConverter\PersistentObjectConverter:
        tags:
            - name: extbase.type_converter
              priority: 2
              target: object
              sources: array,string,int
    CPSIT\T3importExport\Persistence\Factory\FileReferenceFactory:
      public: true
    CPSIT\T3importExport\Component\Initializer\TruncateTables:
      public: true
    CPSIT\T3importExport\Component\Initializer\UpdateTable:
      public: true
    CPSIT\T3importExport\Component\PreProcessor\GenerateFileResource:
      public: true
    CPSIT\T3importExport\Component\PreProcessor\LookUpDB:
      public: true
    CPSIT\T3importExport\Component\PostProcessor\TranslateObject:
      public: true
    CPSIT\T3importExport\Component\PostProcessor\SetL10nParent:
      public: true
    CPSIT\T3importExport\Component\PostProcessor\GenerateFileReference:
      public: true
    CPSIT\T3importExport\Persistence\DataTargetRepository:
      public: true
    CPSIT\T3importExport\Persistence\DataSourceDB:
      public: true
    CPSIT\T3importExport\Persistence\DataSourceCSV:
      public: true
    CPSIT\T3importExport\Persistence\DataSourceXML:
      public: true
    CPSIT\T3importExport\Persistence\DataTargetCSV:
      public: true
      arguments:
        $pathResolver: '@t3import_export.target_path_resolver'
    CPSIT\T3importExport\Persistence\DataSourceQueue:
      public: true
    CPSIT\T3importExport\Persistence\DataTargetQueue:
      public: true
    CPSIT\T3importExport\Persistence\DataTargetDB:
      public: true
    CPSIT\T3importExport\Persistence\Query\SelectJoinQuery:
      public: true
    CPSIT\T3importExport\Persistence\Query\SelectQuery:
      public: true
    CPSIT\T3importExport\Service\TranslationService:
      public: true
    CPSIT\T3importExport\Validation\Configuration\TranslateObjectConfigurationValidator:
      public: true

    CPSIT\T3importExport\Configuration\TypoScriptConverter:
      public: true
    CPSIT\T3importExport\Command\ConvertTypoScriptCommand:
      public: true
